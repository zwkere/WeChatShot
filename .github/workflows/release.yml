name: Build & Release WeChatShot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    # macos-14 runner 已于 2026-11 退役，且需 macOS 26.4+ SDK 才能编译系统离线翻译 API
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Universal App & Package DMG/ZIP
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WeChatShot-macOS-Universal
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
